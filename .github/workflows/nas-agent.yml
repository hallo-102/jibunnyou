name: NAS fixed job agent
on:
  pull_request:
    paths: ['nas_agent/**', 'tests/test_nas_agent.py', '.github/workflows/nas-agent.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest==8.4.1
      - run: python -m pytest tests/test_nas_agent.py -q
