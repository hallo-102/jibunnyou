name: Compute forward validation SHA

on:
  push:
    paths:
      - '.github/workflows/compute_forward_validation_sha.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute frozen file SHA256
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "yosou_py/best_feature_weights_20260730.py"
            "yosou_py/best_feature_weights_20260817.py"
            "config/production_model.json"
            "config/shadow_model.json"
            "model_registry.py"
            "shadow_validation.py"
            "1_keibayosou_config.py"
            "1_keibayosou_features.py"
            "1_keibayosou_penalties.py"
            "1_keibayosou_ranking.py"
            "1_keibayosou_pipeline.py"
            "1_keibayosou_best_import_roi_runner.py"
            "tokutyouryou_keisann/config.py"
          )
          echo 'FORWARD_SHA_BEGIN'
          for f in "${files[@]}"; do
            sha256sum "$f"
          done
          echo 'FORWARD_SHA_END'
